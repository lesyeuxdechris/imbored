name: WINDOWS LATEST RDP

on:
  workflow_dispatch:
    inputs:
      password:
        type: string
        description: 'RDP password'
        required: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 9999

    steps:
      - name: 🔽 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔽 Download Ngrok
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip

      - name: 📦 Extract Ngrok
        run: Expand-Archive ngrok.zip

      - name: 🔐 Set Ngrok Authtoken
        shell: pwsh
        env:
          NGROK_AUTH: ${{ secrets.NGROK_AUTH }}
          TAKEN: ${{ secrets.TAKEN }}
        run: |
          $token = $Env:NGROK_AUTH
          if (-not $token -or $token -eq '') {
            # fallback to the older/alternate secret name if present
            $token = $Env:TAKEN
          }
          if (-not $token -or $token -eq '') {
            Write-Host "❌ No ngrok token provided! Please set secrets.NGROK_AUTH or secrets.TAKEN."
            exit 1
          }
          # don't print the token
          .\ngrok\ngrok.exe config add-authtoken $token

      - name: 🔧 Enable RDP & Configure Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
          Copy-Item wallpaper.bat D:\a\wallpaper.bat

      - name: 👤 Create Dedicated RDP User
        shell: pwsh
        run: |
          $username = "rdpuser"
          $password = ConvertTo-SecureString '${{ github.event.inputs.password }}' -AsPlainText -Force
          
          # Check if user already exists
          $userExists = Get-LocalUser -Name $username -ErrorAction SilentlyContinue
          if (-not $userExists) {
            Write-Host "👤 Creating new RDP user: $username"
            New-LocalUser -Name $username -Password $password -FullName "RDP User" -Description "Temporary RDP user for CI/CD" -PasswordNeverExpires
            Write-Host "✅ User created successfully"
          } else {
            Write-Host "⚠️ User $username already exists, updating password"
            $userExists | Set-LocalUser -Password $password
          }
          
          # Add user to Administrators group
          $adminGroup = Get-LocalGroup -Name "Administrators"
          $userInGroup = Get-LocalGroupMember -Group $adminGroup -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq ".\$username" }
          if (-not $userInGroup) {
            Write-Host "📋 Adding $username to Administrators group"
            Add-LocalGroupMember -Group "Administrators" -Member $username
            Write-Host "✅ User added to Administrators group"
          } else {
            Write-Host "✅ User $username is already in Administrators group"
          }

      - name: 🚀 Start Ngrok Tunnel (fallbacks & verify)
        shell: pwsh
        run: |
          $ngrokExe = Join-Path $PWD 'ngrok\ngrok.exe'
          if (-not (Test-Path $ngrokExe)) {
            Write-Host "❌ ngrok executable not found at $ngrokExe"
            exit 1
          }

          function Is-NgrokRunning {
            return (Get-Process -Name ngrok -ErrorAction SilentlyContinue) -ne $null
          }

          $started = $false

          Write-Host "Attempt 1: Start-Process direct"
          try {
            Start-Process -FilePath $ngrokExe `
              -ArgumentList 'tcp','--region','ap','3389' `
              -WindowStyle Hidden `
              -RedirectStandardOutput 'ngrok.stdout.log' `
              -RedirectStandardError 'ngrok.stderr.log' `
              -PassThru -ErrorAction Stop | Out-Null
            Start-Sleep -Seconds 2
          } catch {
            Write-Host "Direct Start-Process attempt failed: $($_.Exception.Message)"
          }
          if (Is-NgrokRunning) {
            $started = $true
            Write-Host "✅ Started ngrok via Start-Process (direct)"
          }

          if (-not $started) {
            Write-Host "Attempt 2: Start-Job fallback"
            try {
              Start-Job -ScriptBlock { & $using:ngrokExe tcp --region ap 3389 } | Out-Null
              Start-Sleep -Seconds 2
            } catch {
              Write-Host "Start-Job attempt failed: $($_.Exception.Message)"
            }
            if (Is-NgrokRunning) {
              $started = $true
              Write-Host "✅ Started ngrok via Start-Job"
            }
          }

          if (-not $started) {
            Write-Host "Attempt 3: cmd.exe fallback"
            try {
              Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', ".\ngrok\ngrok.exe tcp --region ap 3389" -WindowStyle Hidden -PassThru | Out-Null
              Start-Sleep -Seconds 2
            } catch {
              Write-Host "cmd.exe attempt failed: $($_.Exception.Message)"
            }
            if (Is-NgrokRunning) {
              $started = $true
              Write-Host "✅ Started ngrok via cmd.exe"
            }
          }

          # final wait/retries to ensure the process is seen
          $retries = 10
          while (-not (Is-NgrokRunning) -and $retries -gt 0) {
            Start-Sleep -Seconds 2
            $retries--
          }

          if (-not (Is-NgrokRunning)) {
            Write-Host "❌ Ngrok process NOT found after fallback attempts."
            if (Test-Path ngrok.stderr.log) {
              Write-Host "---- ngrok.stderr.log ----"
              Get-Content ngrok.stderr.log -Raw | Write-Host
            }
            if (Test-Path ngrok.stdout.log) {
              Write-Host "---- ngrok.stdout.log ----"
              Get-Content ngrok.stdout.log -Raw | Write-Host
            }
            Write-Host "---- Attempting to fetch ngrok API (if available) ----"
            try {
              curl.exe -s http://localhost:4040/api/tunnels | Write-Host
            } catch {}
            exit 1
          } else {
            $proc = Get-Process -Name ngrok -ErrorAction SilentlyContinue
            Write-Host "✅ Ngrok process is running (PID: $($proc.Id))"
          }

      - name: 🕐 Wait for Ngrok to Initialize
        shell: pwsh
        run: Start-Sleep -Seconds 20

      - name: ⚙️ Run Setup Script (start.bat) with NGROK URL + credentials
        shell: pwsh
        run: |
          $retries = 10
          $url = $null
          while ($retries -gt 0 -and -not $url) {
            try {
              $tunnels = Invoke-RestMethod -Uri 'http://localhost:4040/api/tunnels' -ErrorAction Stop
              if ($tunnels.tunnels.Count -gt 0) {
                $url = $tunnels.tunnels[0].public_url
              }
            } catch {}
            if (-not $url) { Start-Sleep -Seconds 3 }
            $retries--
          }

          if (-not $url) {
            Write-Host "❌ Could not fetch Ngrok URL. Check ngrok process and authtoken."
            exit 1
          }

          Write-Host "✅ Ngrok Public URL: $url"

          $escapedUrl = $url.Replace('"', '\"')
          $escapedUser = 'rdpuser'.Replace('"','\"')
          $escapedPass = '${{ github.event.inputs.password }}'.Replace('"','\"')
          $osVersion = 'Latest'

          Write-Host "::add-mask::$escapedPass"
          $cmd = ".\start.bat `"$escapedUrl`" `"$escapedUser`" `"$escapedPass`" `"$osVersion`""
          cmd.exe /c $cmd

      - name: 🌐 Debug Ngrok API response raw
        shell: pwsh
        run: curl.exe -s http://localhost:4040/api/tunnels | Write-Host

      - name: 🔁 Keep Runner Alive
        shell: pwsh
        run: .\loop.bat
